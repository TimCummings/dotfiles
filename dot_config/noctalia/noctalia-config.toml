[bar.default]
center = [ "control-center", "clock", "privacy" ]
end = [ "tray", "notes", "clipboard", "network", "volume", "notifications", "session" ]
margin_edge = 0
margin_ends = 0
radius = 0
scale = 1.1000000089406967
start = [ "launcher", "workspaces", "active_window" ]
thickness = 40
widget_spacing = 16

[brightness]
enable_ddcutil = true

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 660.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000004",
    "lockscreen-widget-0000000000000005"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 120.0
    box_width = 512.0
    cx = 1720.0
    cy = 848.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 128.0
    box_width = 576.0
    cx = 1720.0
    cy = 464.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background_padding = 16
        clock_style = "digital"
        format = "{:%a %d/%m/%Y}"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 96.0
    box_width = 176.0
    cx = 1720.0
    cy = 592.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        format = "{:%k:%M}"

[osd]
offset_y = 120
position = "bottom_center"
position_vertical = "center_right"

    [osd.kinds]
    media = false

[plugins]
enabled = [ "noctalia/notes", "noctalia/screen_recorder", "noctalia/timer", "noctalia/wallhaven" ]

[shell]
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    session_search = true
    sort_by_usage = false

[theme]
builtin = "Eldritch"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/tjc/Pictures/Wallpapers/lake_view.jpeg"

[wallpaper.last]
path = "/home/tjc/Pictures/Wallpapers/lake_view.jpeg"

[wallpaper.monitors.DP-1]
path = "/home/tjc/Pictures/Wallpapers/lake_view.jpeg"

[wallpaper.monitors.DP-2]
path = "/home/tjc/Pictures/Wallpapers/lake_view.jpeg"

[weather]
unit = "imperial"

[widget.active_window]
title_scroll = "on_hover"

[widget.bluetooth]
enabled = true

[widget.clock]
format = "{:%H:%M | %a, %d %B %Y}"

[widget.launcher]
capsule = true
capsule_padding = 8

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.privacy]
hide_inactive = true
